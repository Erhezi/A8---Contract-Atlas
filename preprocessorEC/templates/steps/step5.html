<!-- Step 5 - Change Simulation-->
<style>
    #results-container {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        display: none;
    }
    .loader {
        display: none;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 2s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* Adding action buttons styling to match step 3 */
    .action-buttons {
        margin-top: 10px;
        text-align: right;
    }
    
    /* Network graph container styling */
    #network-graph-container {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
    }
    
    /* Create a flex container for side-by-side graphs */
    .graph-container-flex {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 15px;
    }
    
    /* Style for each individual graph */
    .graph-wrapper {
        flex: 1;
        min-width: 300px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: white;
        padding: 10px;
    }
    
    .graph-title {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    .network-graph {
        width: 100%;
        height: 500px;
        border: 1px solid #eee;
        border-radius: 5px;
    }
    
    @media (max-width: 992px) {
        .graph-wrapper {
            flex: 100%;
        }
    }
</style>

<!-- Change Simulation Content -->
<div class="step-content">   
    <p>Click "View Changes" to simulate the changes to be applied to CCX contract(s) when we upload your file.</p>
    
    <button id="view-changes-btn" class="btn btn-primary">View Changes</button>
    <div class="loader" id="loading-spinner"></div>

    <div id="results-container" class="mb-4">
        <h4>Changes to be made</h4>
        <div id="simulation-results">
            <!-- Results will be dynamically populated here -->
        </div>
        
        <!-- Network Graph Container -->
        <div id="network-graph-container" style="display: none;">
            <h5>Contract Overlap Networks</h5>
            
            <!-- Two graphs side by side -->
            <div class="graph-container-flex">
                <!-- Left graph -->
                <div class="graph-wrapper">
                    <div class="graph-title">Original Network</div>
                    <div id="network-graph-left" class="network-graph"></div>
                </div>
                
                <!-- Right graph -->
                <div class="graph-wrapper">
                    <div class="graph-title">Modified Network</div>
                    <div id="network-graph-right" class="network-graph"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="action-buttons">
        <form method="POST" action="{{ url_for('common.process_step', step_id=5) }}">
            <button type="submit" class="btn btn-success">Complete Step 5</button>
        </form>
    </div>
</div>

<!-- Add Plotly.js CDN -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<script>
    document.getElementById('view-changes-btn').addEventListener('click', function() {
        // Show loading spinner
        document.getElementById('loading-spinner').style.display = 'block';
        document.getElementById('results-container').style.display = 'none';
        
        // Make AJAX request to show_changes endpoint
        fetch('/change-simulation/show-changes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            credentials: 'same-origin'
        })
        .then(response => response.json())
        .then(data => {
            // Hide loading spinner
            document.getElementById('loading-spinner').style.display = 'none';
            
            // Display results container
            document.getElementById('results-container').style.display = 'block';
            
            const resultsDiv = document.getElementById('simulation-results');
            
            if (data.success) {
                // Format and display the results
                let html = '<div class="alert alert-success">Changes loaded successfully</div>';
                html += '<div class="card mb-3"><div class="card-body">';
                html += `<p>Number of validated records: <strong>${data.result.validated_count}</strong></p>`;
                html += `<p>Number of records to be processed: <strong>${data.result.stacked_count}</strong></p>`;
                html += '</div></div>';
                
                resultsDiv.innerHTML = html;
                
                // Display network graphs if available
                if (data.result.graph_data) {
                    document.getElementById('network-graph-container').style.display = 'block';
                    
                    // Parse the graph data from JSON
                    const graphData = JSON.parse(data.result.graph_data);
                    
                    // Create the left Plotly graph
                    Plotly.newPlot('network-graph-left', graphData.data, graphData.layout, {
                        responsive: true,
                        displayModeBar: true,
                        modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d'],
                        displaylogo: false
                    });
                    
                    // Create the right Plotly graph (using same data for now as placeholder)
                    // Modify the layout slightly to differentiate
                    const rightLayout = JSON.parse(JSON.stringify(graphData.layout)); // Deep copy
                    rightLayout.title = '';
                    
                    Plotly.newPlot('network-graph-right', graphData.data, rightLayout, {
                        responsive: true,
                        displayModeBar: true,
                        modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d'],
                        displaylogo: false
                    });
                } else {
                    // Hide graph container if no data
                    document.getElementById('network-graph-container').style.display = 'none';
                }
            } else {
                // Display error message
                resultsDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                document.getElementById('network-graph-container').style.display = 'none';
            }
        })
        .catch(error => {
            // Hide loading spinner
            document.getElementById('loading-spinner').style.display = 'none';
            
            // Display error
            document.getElementById('results-container').style.display = 'block';
            document.getElementById('simulation-results').innerHTML = 
                '<div class="alert alert-danger">An error occurred while processing your request. Please try again.</div>';
            document.getElementById('network-graph-container').style.display = 'none';
            console.error('Error:', error);
        });
    });
</script>
