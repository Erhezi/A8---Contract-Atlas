{% extends 'layout.html' %}

{% block title %}Register - Contract Atlas{% endblock %}

{% block extra_styles %}
<style>
  .auth-card {max-width:520px;margin:40px auto;padding:30px 20px;background:#ffffff;border:1px solid #e2e6ea;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.06);}  
  .auth-card h2 {margin-top:0;font-weight:600;color:#2c3e50;font-size:1.45rem;}
  .auth-card form {margin-top:15px;display:block;}
  .auth-card .form-label {font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#34495e;margin-bottom:4px;}
  .auth-card .form-control, .auth-card .form-select {border:1px solid #cfd7de;border-radius:4px;padding:10px 12px;font-size:0.95rem;transition:border-color .15s, box-shadow .15s;background:#fff;width:100%;box-sizing:border-box;}
  .auth-card .form-control:focus, .auth-card .form-select:focus {outline:none;border-color:#3498db;box-shadow:0 0 0 3px rgba(52,152,219,0.25);}  
  select.form-select {appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:linear-gradient(45deg, transparent 50%, #3498db 50%),linear-gradient(135deg, #3498db 50%, transparent 50%),linear-gradient(to right, #cfd7de, #cfd7de);background-position:calc(100% - 18px) calc(50% - 5px),calc(100% - 13px) calc(50% - 5px),calc(100% - 40px) 50%;background-size:5px 5px,5px 5px,1px 60%;background-repeat:no-repeat;}
  select.form-select:focus {background-image:linear-gradient(45deg, transparent 50%, #2587c8 50%),linear-gradient(135deg, #2587c8 50%, transparent 50%),linear-gradient(to right, #3498db, #3498db);} 
  .btn-container {text-align:center;margin-top:25px;}
  .btn-primary {display:inline-block;background:#3498db;border:none;color:#fff;font-weight:600;padding:10px 22px;border-radius:4px;cursor:pointer;font-size:0.95rem;letter-spacing:.3px;transition:background .18s, transform .18s;}
  .btn-primary:hover {background:#2587c8;}
  .btn-primary:active {background:#1f6d9f;transform:translateY(1px);} 
  .auth-alt {margin-top:20px;font-size:0.85rem;color:#555;text-align:center;}
  .auth-alt a {color:#3498db;text-decoration:none;font-weight:600;}
  .auth-alt a:hover {text-decoration:underline;}
  .two-col {display:flex;gap:14px;flex-wrap:wrap;}
  .two-col .mb-3 {flex:1 1 240px;}
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Register</h2>
  <form method="POST">
    <div class="two-col">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" name="username" required>
      </div>
    </div>
    <div class="two-col">
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" name="confirm_password" required>
      </div>
    </div>
    <div class="mb-3" style="max-width:240px;">
      <label for="role" class="form-label">Role</label>
      <select class="form-select" name="role" required>
        <option value="sourcing" selected>Sourcing</option>
        <option value="mdm">MDM</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="btn-container">
      <button type="submit" class="btn-primary">Register</button>
    </div>
  </form>
  <p class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
</div>
{% endblock %}
